name: Refresh Broward map data

on:
  schedule:
    - cron: '17 9 * * *'   # daily, 09:17 UTC (about 5am Florida)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['broward/scripts/**', 'broward/data/manual_cams.json', '.github/workflows/broward-data.yml']

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build camera list
        run: python broward/scripts/build_cams.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add broward/data
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "Broward data refresh" && git push; fi
