# Builds the Mini Load Board app and runs all three test suites.
#
# The planted bugs (see mini-load-board/BUG_ANSWERS.md) make a handful of tests
# fail on purpose, so this workflow is RED until you fix them. Every suite still
# runs (`if: ${{ !cancelled() }}`) and the reports are uploaded either way, so
# you can inspect the failures from the Actions tab.
name: Mini Load Board tests

on:
  push:
    paths:
      - "mini-load-board/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "mini-load-board/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch: # "Run workflow" button in the GitHub UI

defaults:
  run:
    working-directory: mini-load-board

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  LOADBOARD_URL: http://localhost:5000

jobs:
  test:
    runs-on: ubuntu-latest # Comes with Google Chrome, which Selenium Manager picks up.
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mini-load-board/tests/playwright/package-lock.json

      # ---- Build everything once ---------------------------------------------
      - name: Build app and C# test projects
        run: dotnet build MiniLoadBoard.sln --configuration Release

      # ---- Start the app for the C# suites -------------------------------------
      - name: Start the app in the background
        run: |
          dotnet run --project src/MiniLoadBoard.Api --configuration Release --no-build \
            --urls http://localhost:5000 > app.log 2>&1 &
          echo $! > app.pid
          # Wait (up to ~60 s) for the API to answer before running tests.
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/api/carriers > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:5000/api/carriers > /dev/null || { cat app.log; exit 1; }

      - name: RestSharp API tests
        run: >
          dotnet test tests/RestSharpTests --no-build --configuration Release
          --logger "trx;LogFileName=restsharp.trx" --results-directory TestResults

      - name: Selenium UI tests (headless Chrome)
        if: ${{ !cancelled() }}
        env:
          HEADLESS: "true"
        run: >
          dotnet test tests/SeleniumTests --no-build --configuration Release
          --logger "trx;LogFileName=selenium.trx" --results-directory TestResults

      - name: Stop the app
        if: ${{ always() }}
        run: |
          kill "$(cat app.pid)" || true
          # Playwright starts its own copy on the same port, so wait until it is free.
          for i in $(seq 1 15); do
            curl -sf http://localhost:5000/api/carriers > /dev/null || break
            sleep 1
          done

      # ---- Playwright starts its own copy of the app (webServer in config) -----
      - name: Install Playwright dependencies
        if: ${{ !cancelled() }}
        working-directory: mini-load-board/tests/playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Playwright UI + API + accessibility tests
        if: ${{ !cancelled() }}
        working-directory: mini-load-board/tests/playwright
        run: npx playwright test

      # ---- Reports -------------------------------------------------------------
      - name: Upload Playwright HTML report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: mini-load-board/tests/playwright/playwright-report
          retention-days: 14

      - name: Upload .NET test results (.trx) and Selenium screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: |
            mini-load-board/TestResults
            mini-load-board/tests/SeleniumTests/bin/**/screenshots
          if-no-files-found: ignore
          retention-days: 14
