<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Broward Live Map</title>
<meta name="description" content="Live webcams, traffic cameras, cities, demographics and crime across Broward County, Florida, on one map.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230f766e'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23fff'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%230f766e'/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="vendor/MarkerCluster.css">
<link rel="stylesheet" href="vendor/MarkerCluster.Default.css">
<style>
  :root{
    --bg:#f6f7f9; --surface:#fff; --surface-2:#eef1f5; --border:#d9dee6; --text:#111827; --text-2:#4b5563; --muted:#8b93a1;
    --accent:#0f766e; --accent-text:#fff;
    --crime:#b42318; --crime-bg:#fde8e6; --biz:#7c3aed;
    --traffic:#2563eb; --beach:#0891b2; --marina:#7c3aed; --port:#b45309; --airport:#475569; --downtown:#db2777; --weather:#65a30d; --nature:#15803d; --attraction:#ea580c; --other:#6b7280;
    --shadow:0 1px 2px rgba(16,24,40,.08),0 4px 12px rgba(16,24,40,.08);
    --font:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#0f1318; --surface:#171c23; --surface-2:#1f252e; --border:#2a313b; --text:#e8ecf1; --text-2:#b4bcc7; --muted:#7c8694; --accent:#2dd4bf; --accent-text:#06201c;
    --crime:#f0574c; --crime-bg:#3a1512; --biz:#a78bfa;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 4px 12px rgba(0,0,0,.4);
  }}
  :root[data-theme="dark"]{
    --bg:#0f1318; --surface:#171c23; --surface-2:#1f252e; --border:#2a313b; --text:#e8ecf1; --text-2:#b4bcc7; --muted:#7c8694; --accent:#2dd4bf; --accent-text:#06201c;
    --crime:#f0574c; --crime-bg:#3a1512; --biz:#a78bfa;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 4px 12px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;overflow:hidden}
  button{font:inherit;cursor:pointer}
  #map{position:absolute;inset:0}
  /* ---- top bar */
  .topbar{position:absolute;top:10px;left:10px;right:10px;z-index:1000;display:flex;gap:8px;align-items:center;pointer-events:none}
  .topbar > *{pointer-events:auto}
  .brand{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 12px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap}
  .brand .sub{font-weight:400;color:var(--muted);font-size:12px}
  .search{flex:1;max-width:420px;display:flex;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
  .search input{flex:1;border:0;background:transparent;color:var(--text);padding:9px 12px;font:inherit;min-width:0}
  .search input:focus{outline:none}
  .iconbtn{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 10px;box-shadow:var(--shadow);color:var(--text);font-weight:600;white-space:nowrap}
  .iconbtn.active{background:var(--accent);color:var(--accent-text);border-color:transparent}
  /* ---- layers panel */
  .panel{position:absolute;z-index:1000;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:auto}
  #layers{top:60px;left:10px;width:270px;max-height:calc(100% - 100px);padding:10px 12px}
  #layers h3{margin:6px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .lrow{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px}
  .lrow label{display:flex;align-items:center;gap:8px;flex:1;cursor:pointer}
  .lrow .count{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
  .sw{width:12px;height:12px;border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
  .lrow.soon{color:var(--muted)}
  .lrow.soon .tag{font-size:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:1px 6px}
  select.city{width:100%;padding:6px 8px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font:inherit;margin:4px 0 6px}
  .legendnote{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.4}
  /* ---- viewer */
  #viewer{top:60px;right:10px;width:min(520px,calc(100% - 20px));max-height:calc(100% - 100px);display:none;flex-direction:column}
  #viewer.open{display:flex}
  #viewer .vh{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border)}
  #viewer .vh b{font-size:15px;display:block}
  #viewer .vh .meta{color:var(--text-2);font-size:12px;margin-top:2px}
  #viewer .close{margin-left:auto;background:none;border:0;color:var(--muted);font-size:20px;line-height:1;padding:0 4px}
  .frame{position:relative;background:#000;aspect-ratio:16/9;width:100%}
  .frame iframe,.frame video,.frame img{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:contain;background:#000}
  .frame .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#ccc;text-align:center;padding:20px;font-size:13px}
  .vfoot{display:flex;gap:8px;align-items:center;padding:8px 12px;font-size:12px;color:var(--text-2);flex-wrap:wrap}
  .vfoot a{color:var(--accent);font-weight:600;text-decoration:none}
  .vfoot .spacer{flex:1}
  .pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-2)}
  /* ---- markers */
  .cam-pin{position:relative;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 2px 4px rgba(0,0,0,.3)}
  .cam-pin.nofeed{opacity:.45}
  .cam-pin.big{width:18px;height:18px}
  .cam-pin.live::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid currentColor;opacity:.5;animation:pulse 2s infinite}
  @keyframes pulse{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.3);opacity:0}}
  .marker-cluster-small{background:rgba(15,118,110,.25)} .marker-cluster-small div{background:rgba(15,118,110,.8);color:#fff}
  .marker-cluster-medium{background:rgba(15,118,110,.25)} .marker-cluster-medium div{background:rgba(15,118,110,.85);color:#fff}
  .marker-cluster-large{background:rgba(15,118,110,.25)} .marker-cluster-large div{background:rgba(15,118,110,.9);color:#fff}
  .leaflet-popup-content-wrapper{border-radius:10px;background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
  .leaflet-popup-tip{background:var(--surface)}
  .leaflet-popup-content{margin:10px 12px;font-size:13px}
  .leaflet-popup-content b{display:block;margin-bottom:2px}
  .leaflet-popup-content .thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;margin:6px 0;background:#000;display:block}
  .leaflet-popup-content button{margin-top:4px;background:var(--accent);color:var(--accent-text);border:0;border-radius:6px;padding:6px 10px;font-weight:600}
  .leaflet-control-zoom a,.leaflet-control-layers{background:var(--surface)!important;color:var(--text)!important;border-color:var(--border)!important}
  .leaflet-control-layers{border-radius:10px!important;box-shadow:var(--shadow)!important}
  .leaflet-container{font-family:var(--font)}
  .leaflet-control-attribution{background:rgba(255,255,255,.75)!important;font-size:10px}
  :root[data-theme="dark"] .leaflet-control-attribution,:root:not([data-theme="light"]) .leaflet-control-attribution{background:rgba(23,28,35,.8)!important;color:#aaa!important}
  :root[data-theme="dark"] .leaflet-control-attribution a{color:#8fd}
  :root[data-theme="dark"] .leaflet-tile-pane.streets{filter:brightness(.85) contrast(1.05) saturate(.85)}
  .legend{position:absolute;right:10px;bottom:90px;z-index:1000;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:var(--shadow);display:none;max-width:240px}
  .legend.open{display:block}
  .legend b{display:block;margin-bottom:4px;font-size:12px}
  .legend .row{display:flex;align-items:center;gap:6px;margin:2px 0;color:var(--text-2)}
  .legend .box{width:18px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.15);flex:none}
  .legend .src{color:var(--muted);font-size:11px;margin-top:4px}
  .city-label{background:none;border:0;box-shadow:none;color:var(--text);font-weight:700;font-size:11px;text-shadow:0 0 3px var(--surface),0 0 3px var(--surface),0 0 3px var(--surface);white-space:nowrap;pointer-events:none}
  .stats{padding:10px 12px;font-size:13px}
  .stats .big{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:10px}
  .stats .tile{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
  .stats .tile .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .stats .tile .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
  .stats .bars{display:grid;gap:5px;margin:6px 0 10px}
  .stats .bar{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:8px;font-size:12px;color:var(--text-2)}
  .stats .bar .m{height:9px;background:var(--surface-2);border:1px solid var(--border);border-radius:5px;overflow:hidden}
  .stats .bar .m i{display:block;height:100%;background:var(--accent);border-radius:4px}
  .stats .bar .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--text)}
  .stats .note{color:var(--muted);font-size:11px;line-height:1.4}
  .radio{display:flex;gap:10px;font-size:13px;margin:2px 0 6px;flex-wrap:wrap}
  .chips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 6px}
  .chip{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);cursor:pointer;user-select:none}
  .chip.on{background:var(--crime-bg);color:var(--crime);border-color:var(--crime)}
  .dates{display:flex;gap:6px;align-items:center;font-size:12px;margin:4px 0 6px}
  .dates input{flex:1;min-width:0;padding:4px 6px;border-radius:6px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font:inherit;font-size:12px}
  .crime-pin{width:10px;height:10px;border-radius:50%;background:var(--crime);border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
  .biz-pin{width:8px;height:8px;border-radius:2px;background:var(--biz);border:1px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
  .crime-cluster{background:rgba(190,40,40,.25)} .crime-cluster div{background:rgba(190,40,40,.85);color:#fff}
  .agencies{font-size:11px;color:var(--muted);line-height:1.4;margin-top:4px}
  .status{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:1000;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:6px 14px;font-size:12px;color:var(--text-2);box-shadow:var(--shadow);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
  @media (max-width:700px){
    #layers{width:calc(100% - 20px);max-height:40%;display:none} #layers.open{display:block}
    #viewer{top:auto;bottom:0;right:0;width:100%;max-height:70%;border-radius:12px 12px 0 0}
    .brand .sub{display:none} .search{max-width:none}
    .status{display:none} .legend{bottom:80px;right:8px}
  }
</style>
</head>
<body>
<div id="map" role="application" aria-label="Map of Broward County"></div>

<div class="topbar">
  <div class="brand">📍 Broward Live <span class="sub">cams · cities · crime</span></div>
  <div class="search"><input id="q" type="search" placeholder="Search cameras, roads, cities…" aria-label="Search"></div>
  <button class="iconbtn" id="layersBtn" title="Layers">☰ Layers</button>
  <button class="iconbtn" id="satBtn" title="Satellite view">🛰 Satellite</button>
  <button class="iconbtn" id="themeBtn" title="Light/dark">◐</button>
</div>

<aside id="layers" class="panel" aria-label="Layers and filters">
  <h3>Cameras</h3>
  <div id="camTypes"></div>
  <h3>City</h3>
  <select class="city" id="cityFilter"><option value="">All of Broward</option></select>
  <h3>Cities</h3>
  <div class="lrow"><label><input type="checkbox" id="cityLines" checked><span class="sw" style="background:var(--accent)"></span>City boundaries</label><span class="count" id="cityCount"></span></div>
  <div class="lrow"><label><input type="checkbox" id="cityLabels" checked> Names on the map</label></div>
  <h3>Demographics</h3>
  <select class="city" id="metric">
    <option value="">None (no shading)</option>
    <option value="population">Population</option>
    <option value="median_income">Median household income</option>
    <option value="median_home_value">Median home value</option>
    <option value="median_age">Median age</option>
    <option value="pct_renters">% renters</option>
    <option value="pct_poverty">% below poverty line</option>
    <option value="pct_bachelors">% with bachelor's or higher</option>
    <option value="pct_hispanic">% Hispanic or Latino</option>
    <option value="pct_white">% White (non-Hispanic)</option>
    <option value="pct_black">% Black (non-Hispanic)</option>
    <option value="pct_asian">% Asian (non-Hispanic)</option>
  </select>
  <div class="radio"><label><input type="radio" name="level" value="city" checked> by city</label><label><input type="radio" name="level" value="tract"> by neighborhood (tract)</label></div>
  <div class="legendnote" id="demoNote"></div>
  <h3>Crime</h3>
  <div class="lrow"><label><input type="checkbox" id="crimeOn"><span class="sw" style="background:var(--crime)"></span>Incidents</label><span class="count" id="crimeCount"></span></div>
  <div class="radio" id="crimeMode"><label><input type="radio" name="cmode" value="pins" checked> pins</label><label><input type="radio" name="cmode" value="heat"> heat map</label><label><input type="radio" name="cmode" value="both"> both</label></div>
  <div class="dates"><input type="date" id="crimeFrom" aria-label="From date"><span>to</span><input type="date" id="crimeTo" aria-label="To date"></div>
  <div class="chips" id="crimeCats"></div>
  <div class="agencies" id="crimeAgencies">Tick "Incidents" to load.</div>
  <h3>Businesses</h3>
  <select class="city" id="bizMode">
    <option value="">None</option>
    <option value="city">Mapped businesses per city (OpenStreetMap)</option>
    <option value="zip">Mapped businesses per ZIP (OpenStreetMap)</option>
    <option value="zbp">Official establishments per ZIP (Census)</option>
  </select>
  <select class="city" id="bizType"><option value="">All types</option></select>
  <div class="lrow"><label><input type="checkbox" id="bizPoints" checked><span class="sw" style="background:var(--biz);border-radius:2px"></span>Show business points when zoomed in</label></div>
  <div class="legendnote" id="bizNote"></div>
  <div class="legendnote" id="dataNote">Loading camera list…</div>
</aside>

<aside id="viewer" class="panel" aria-label="Camera viewer">
  <div class="vh"><div><b id="vTitle"></b><div class="meta" id="vMeta"></div></div><button class="close" id="vClose" aria-label="Close">×</button></div>
  <div class="frame" id="vFrame"></div>
  <div class="vfoot" id="vFoot"></div>
</aside>

<div class="legend" id="legend"></div>
<div class="status" id="status">Loading…</div>

<script src="vendor/leaflet.js"></script>
<script src="vendor/leaflet.markercluster.js"></script>
<script src="vendor/hls.min.js"></script>
<script src="vendor/leaflet-heat.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TYPES = {
  traffic:   {label:'Traffic (FDOT)', color:'var(--traffic)'},
  beach:     {label:'Beach & pier',   color:'var(--beach)'},
  marina:    {label:'Marina & Intracoastal', color:'var(--marina)'},
  port:      {label:'Port Everglades', color:'var(--port)'},
  airport:   {label:'Airport', color:'var(--airport)'},
  downtown:  {label:'Downtown & city', color:'var(--downtown)'},
  weather:   {label:'Weather stations', color:'var(--weather)'},
  nature:    {label:'Nature & wildlife', color:'var(--nature)'},
  attraction:{label:'Attractions', color:'var(--attraction)'},
  other:     {label:'Other', color:'var(--other)'},
};
const BROWARD = [[25.95, -80.95],[26.40, -79.95]];

// ---- map & basemaps
const map = L.map('map', {zoomControl:false, minZoom:9, maxBounds:[[25.6,-81.4],[26.7,-79.6]]}).fitBounds([[25.96,-80.50],[26.35,-80.05]]);
L.control.zoom({position:'bottomright'}).addTo(map);
const streets = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {maxZoom:20, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'});
const dark = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}{r}.png', {maxZoom:20, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'});
const sat = L.layerGroup([
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxZoom:19, attribution:'Imagery &copy; Esri, Maxar, Earthstar Geographics'}),
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png', {maxZoom:20, pane:'overlayPane'}),
]);
let satOn = false;
function isDark(){ const t = document.documentElement.dataset.theme; return t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches); }
function applyBase(){
  [streets, dark, sat].forEach(l => map.removeLayer(l));
  (satOn ? sat : (isDark() ? dark : streets)).addTo(map);
  $('#satBtn').classList.toggle('active', satOn);
}
$('#satBtn').onclick = () => { satOn = !satOn; applyBase(); try{localStorage.setItem('bl.sat', satOn?'1':'')}catch(e){} };
$('#themeBtn').onclick = () => { const cur = document.documentElement.dataset.theme; const next = cur === 'dark' ? 'light' : cur === 'light' ? '' : 'dark'; if (next) document.documentElement.dataset.theme = next; else delete document.documentElement.dataset.theme; try{localStorage.setItem('bl.theme', next)}catch(e){}; applyBase(); };
try { const t = localStorage.getItem('bl.theme'); if (t) document.documentElement.dataset.theme = t; satOn = !!localStorage.getItem('bl.sat'); } catch(e){}
applyBase();
$('#layersBtn').onclick = () => $('#layers').classList.toggle('open');

// ---- cameras
let cams = [], markers = new Map();
const cluster = L.markerClusterGroup({maxClusterRadius: 36, disableClusteringAtZoom: 14, spiderfyOnMaxZoom: true, showCoverageOnHover: false});
const plain = L.layerGroup();   // non-traffic cams stay visible at every zoom
map.addLayer(cluster); map.addLayer(plain);
const enabledTypes = new Set(Object.keys(TYPES));
let cityFilter = '', query = '';

function pinIcon(c){
  const t = TYPES[c.type] || TYPES.other;
  return L.divIcon({className:'', html:`<div class="cam-pin ${c.type !== 'traffic' ? 'big' : ''} ${c.has_feed === false ? 'nofeed' : c.kind !== 'link' ? 'live' : ''}" style="background:${t.color};color:${t.color}"></div>`, iconSize:[14,14], iconAnchor:[7,7], popupAnchor:[0,-8]});
}
function matches(c){
  if (!enabledTypes.has(c.type || 'other')) return false;
  if (cityFilter && (c.city || '') !== cityFilter) return false;
  if (query){ const q = query.toLowerCase(); if (!((c.name||'').toLowerCase().includes(q) || (c.city||'').toLowerCase().includes(q) || (c.operator||'').toLowerCase().includes(q) || (c.road||'').toLowerCase().includes(q))) return false; }
  return true;
}
function rebuild(){
  cluster.clearLayers(); plain.clearLayers(); markers.clear();
  let n = 0;
  for (const c of cams){
    if (!matches(c)) continue;
    const m = L.marker([c.lat, c.lon], {icon: pinIcon(c), title: c.name});
    m.bindPopup(() => popupHtml(c), {maxWidth: 260});
    m.on('popupopen', () => { const b = document.querySelector('.leaflet-popup button[data-view]'); if (b) b.onclick = () => openViewer(c); });
    m.camId = c.id;
    markers.set(c.id, m); (c.type === 'traffic' ? cluster : plain).addLayer(m); n++;
  }
  $('#status').textContent = `${n} of ${cams.length} cameras shown` + (cityFilter ? ` · ${cityFilter}` : '') + (query ? ` · "${query}"` : '');
}
function popupHtml(c){
  const thumb = c.kind === 'image' ? `<img class="thumb" src="${esc(c.src)}${c.src.includes('?') ? '&' : '?'}t=${Date.now()}" alt="" loading="lazy" onerror="this.style.display='none'">` : (c.thumb ? `<img class="thumb" src="${esc(c.thumb)}" alt="" loading="lazy" onerror="this.style.display='none'">` : '');
  return `<b>${esc(c.name)}</b><span class="pill">${esc((TYPES[c.type]||TYPES.other).label)}</span> ${c.city ? '<span class="pill">'+esc(c.city)+'</span>' : ''}${c.has_feed === false ? '<div class="pill" style="margin-top:6px">No live feed at the moment</div>' : ''}${thumb}<button data-view="1">${c.kind === 'link' ? 'Open camera ↗' : '▶ Watch'}</button>`;
}

// ---- viewer
let hls = null, imgTimer = null, current = null;
function closeViewer(){ $('#viewer').classList.remove('open'); const vf = $('#vFrame'); vf.innerHTML = ''; vf.style.aspectRatio = ''; vf.style.background = ''; if (hls){ hls.destroy(); hls = null; } clearInterval(imgTimer); current = null; history.replaceState(null, '', location.pathname + location.search); }
$('#vClose').onclick = closeViewer;
function openViewer(c){
  if (c.kind === 'link'){ window.open(c.page || c.src, '_blank', 'noopener'); return; }
  closeViewer(); current = c;
  $('#viewer').classList.add('open');
  $('#vTitle').textContent = c.name;
  $('#vMeta').textContent = [c.operator, c.city, (TYPES[c.type]||TYPES.other).label].filter(Boolean).join(' · ');
  const f = $('#vFrame'); f.innerHTML = '';
  if (c.kind === 'youtube'){
    const src = c.src.includes('/embed/') ? c.src : `https://www.youtube.com/embed/${c.src}`;
    f.innerHTML = `<iframe src="${esc(src)}${src.includes('?') ? '&' : '?'}autoplay=1&mute=1&playsinline=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" title="${esc(c.name)}"></iframe>`;
  } else if (c.kind === 'iframe'){
    f.innerHTML = `<iframe src="${esc(c.src)}" allow="autoplay; fullscreen" allowfullscreen referrerpolicy="no-referrer" title="${esc(c.name)}"></iframe>`;
  } else if (c.kind === 'hls'){
    const v = document.createElement('video'); v.controls = true; v.muted = true; v.autoplay = true; v.playsInline = true; f.appendChild(v);
    if (v.canPlayType('application/vnd.apple.mpegurl')) v.src = c.src;
    else if (window.Hls && Hls.isSupported()){ hls = new Hls({lowLatencyMode:true}); hls.loadSource(c.src); hls.attachMedia(v); hls.on(Hls.Events.ERROR, (e, d) => { if (d.fatal){ f.innerHTML = `<div class="msg">This stream would not play here (the owner may block other sites). <br><br><a href="${esc(c.page||c.src)}" target="_blank" rel="noopener" style="color:#8fd">Open it on the source site ↗</a></div>`; } }); }
    else f.innerHTML = '<div class="msg">Your browser cannot play this stream.</div>';
  } else if (c.kind === 'image'){
    const img = document.createElement('img'); img.alt = c.name;
    const load = () => { img.src = c.src + (c.src.includes('?') ? '&' : '?') + 't=' + Date.now(); };
    img.onerror = () => { f.innerHTML = `<div class="msg">The snapshot did not load. The source may be offline or block other sites.<br><br><a href="${esc(c.page||c.src)}" target="_blank" rel="noopener" style="color:#8fd">Open it on the source site ↗</a></div>`; clearInterval(imgTimer); };
    f.appendChild(img); load(); imgTimer = setInterval(load, (c.refresh || 15) * 1000);
  }
  const foot = $('#vFoot');
  foot.innerHTML = `<span>${c.kind === 'image' ? `Snapshot, refreshes every ${c.refresh || 15}s` : c.kind === 'youtube' ? 'YouTube live stream' : c.kind === 'hls' ? 'Live video' : 'Embedded player'}</span>${c.notes ? `<span class="pill" title="${esc(c.notes)}">ⓘ</span>` : ''}<span class="spacer"></span>${c.page ? `<a href="${esc(c.page)}" target="_blank" rel="noopener">Source ↗</a>` : ''}<a href="https://www.google.com/maps?q=${c.lat},${c.lon}" target="_blank" rel="noopener">Directions ↗</a><a href="#cam=${encodeURIComponent(c.id)}" id="vShare">Share link</a>`;
  $('#vShare').onclick = e => { e.preventDefault(); const u = location.origin + location.pathname + '#cam=' + encodeURIComponent(c.id); navigator.clipboard?.writeText(u); $('#vShare').textContent = 'Copied ✔'; setTimeout(() => $('#vShare').textContent = 'Share link', 1500); };
  history.replaceState(null, '', '#cam=' + encodeURIComponent(c.id));
  map.panTo([c.lat, c.lon], {animate:true});
}

// ---- filters UI
function buildFilters(){
  const counts = {}; cams.forEach(c => counts[c.type||'other'] = (counts[c.type||'other']||0) + 1);
  $('#camTypes').innerHTML = Object.entries(TYPES).filter(([k]) => counts[k]).map(([k, t]) => `<div class="lrow"><label><input type="checkbox" data-type="${k}" checked><span class="sw" style="background:${t.color}"></span>${t.label}</label><span class="count">${counts[k]}</span></div>`).join('');
  document.querySelectorAll('input[data-type]').forEach(cb => cb.onchange = () => { cb.checked ? enabledTypes.add(cb.dataset.type) : enabledTypes.delete(cb.dataset.type); rebuild(); });
  const cities = [...new Set(cams.map(c => c.city).filter(Boolean))].sort();
  $('#cityFilter').innerHTML = '<option value="">All of Broward</option>' + cities.map(c => `<option>${esc(c)}</option>`).join('');
  $('#cityFilter').onchange = () => { cityFilter = $('#cityFilter').value; rebuild(); renderCrime(); if (cityFilter){ const pts = cams.filter(c => c.city === cityFilter); if (pts.length) map.fitBounds(L.latLngBounds(pts.map(c => [c.lat, c.lon])).pad(0.2)); } };
}
let qTimer; $('#q').oninput = () => { clearTimeout(qTimer); qTimer = setTimeout(() => { query = $('#q').value.trim(); rebuild(); }, 200); };

// ---- cities, demographics
const METRICS = {
  population:{label:'Population', fmt:v => v.toLocaleString()},
  median_income:{label:'Median household income', fmt:v => '$' + Math.round(v).toLocaleString()},
  median_home_value:{label:'Median home value', fmt:v => '$' + Math.round(v).toLocaleString()},
  median_age:{label:'Median age', fmt:v => v.toFixed(1)},
  pct_renters:{label:'% renters', fmt:v => v.toFixed(0) + '%'},
  pct_poverty:{label:'% below poverty line', fmt:v => v.toFixed(1) + '%'},
  pct_bachelors:{label:"% bachelor's or higher", fmt:v => v.toFixed(0) + '%'},
  pct_hispanic:{label:'% Hispanic or Latino', fmt:v => v.toFixed(0) + '%'},
  pct_white:{label:'% White (non-Hispanic)', fmt:v => v.toFixed(0) + '%'},
  pct_black:{label:'% Black (non-Hispanic)', fmt:v => v.toFixed(0) + '%'},
  pct_asian:{label:'% Asian (non-Hispanic)', fmt:v => v.toFixed(1) + '%'},
};
const RAMP = ['#d9f1ee','#a6dcd6','#67bfb7','#2f9a92','#0b6a63'];   // one hue, light to dark
let cityGeo = null, tractGeo = null, demo = null;
let cityLayer = L.geoJSON(null, {style: cityStyle, onEachFeature: onCity}).addTo(map);
let tractLayer = L.geoJSON(null, {style: tractStyle, onEachFeature: onTract});
let labelLayer = L.layerGroup().addTo(map);
let metric = '', level = 'city', breaks = [];

function statsFor(lvl, key){ if (!demo || !demo.acs) return null; const t = lvl === 'city' ? demo.acs.cities : demo.acs.tracts; return t ? t[key] : null; }
function valueFor(f){ const st = level === 'city' ? statsFor('city', f.properties.name) : statsFor('tract', f.properties.geoid); return st && st[metric] != null ? st[metric] : null; }
function colorFor(v){ if (v == null || !breaks.length) return null; let i = 0; while (i < breaks.length - 1 && v > breaks[i]) i++; return RAMP[Math.min(i, RAMP.length - 1)]; }
function cityStyle(f){
  const fill = metric && level === 'city' ? colorFor(valueFor(f)) : null;
  const uninc = f.properties.name === 'Unincorporated Broward';
  return {color: 'var(--accent)', weight: uninc ? 1 : 1.4, opacity: 0.9, dashArray: uninc ? '3 4' : null, fillColor: fill || '#000', fillOpacity: fill ? 0.55 : 0.02};
}
function tractStyle(f){ const fill = colorFor(valueFor(f)); return {color: '#555', weight: 0.5, opacity: 0.6, fillColor: fill || '#000', fillOpacity: fill ? 0.6 : 0}; }
function onCity(f, layer){
  layer.on('click', () => openCity(f.properties.name));
  layer.on('mouseover', e => { e.target.setStyle({weight: 3}); showTip(e, f.properties.name, level === 'city' ? valueFor(f) : null); });
  layer.on('mouseout', e => { cityLayer.resetStyle(e.target); map.closeTooltip(); });
}
function onTract(f, layer){
  layer.on('mouseover', e => { showTip(e, 'Tract ' + f.properties.name, valueFor(f)); });
  layer.on('mouseout', () => map.closeTooltip());
}
function showTip(e, title, v){ const m = METRICS[metric]; L.tooltip({sticky:true}).setLatLng(e.latlng).setContent(`<b>${esc(title)}</b>${m && v != null ? '<br>' + esc(m.label) + ': ' + m.fmt(v) : ''}`).addTo(map); }
function quantiles(vals){ const v = vals.filter(x => x != null).sort((a,b) => a-b); if (v.length < 5) return v.length ? [v[v.length-1]] : []; return [0.2,0.4,0.6,0.8,1].map(q => v[Math.min(v.length-1, Math.ceil(q*v.length)-1)]); }
function applyDemo(){
  const m = METRICS[metric];
  const feats = level === 'city' ? (cityGeo ? cityGeo.features : []) : (tractGeo ? tractGeo.features : []);
  breaks = m ? quantiles(feats.map(valueFor)) : [];
  cityLayer.setStyle(cityStyle);
  if (level === 'tract' && metric){ if (!map.hasLayer(tractLayer)) tractLayer.addTo(map); tractLayer.setStyle(tractStyle); cityLayer.bringToFront(); }
  else if (map.hasLayer(tractLayer)) map.removeLayer(tractLayer);
  const lg = $('#legend');
  if (m && breaks.length){
    let lo = null;
    lg.innerHTML = `<b>${esc(m.label)}</b>` + breaks.map((b, i) => { const row = `<div class="row"><span class="box" style="background:${RAMP[i]}"></span>${lo == null ? 'up to ' : m.fmt(lo) + ' to '}${m.fmt(b)}</div>`; lo = b; return row; }).join('') + `<div class="src">${esc(demo.acs.label)}, by ${level === 'city' ? 'city' : 'census tract'}</div>`;
    lg.classList.add('open');
  } else lg.classList.remove('open');
  $('#demoNote').textContent = demo && demo.acs ? '' : 'Demographic figures are not loaded yet (the nightly build fills them in).';
}
function renderLabels(){
  labelLayer.clearLayers();
  if (!cityGeo || !$('#cityLabels').checked || !$('#cityLines').checked) return;
  const z = map.getZoom();
  for (const f of cityGeo.features){
    if (f.properties.name === 'Unincorporated Broward') continue;
    const a = f.properties.area_deg2; if ((z < 11 && a < 0.002) || (z < 13 && a < 0.0004)) continue;   // skip tiny towns when zoomed out
    const c = L.geoJSON(f).getBounds().getCenter();
    labelLayer.addLayer(L.marker(c, {icon: L.divIcon({className:'city-label', html: esc(f.properties.name), iconSize: null}), interactive: false}));
  }
}
map.on('zoomend', renderLabels);
function openCity(name){
  closeViewer();
  const st = statsFor('city', name) || {};
  const county = demo && demo.acs ? demo.acs.county : null;
  const n = cams.filter(c => c.city === name).length;
  $('#viewer').classList.add('open');
  $('#vTitle').textContent = name;
  $('#vMeta').textContent = demo && demo.acs ? demo.acs.label : 'Broward County, Florida';
  const tile = (l, v, f) => `<div class="tile"><div class="l">${l}</div><div class="v">${v == null ? '—' : f(v)}</div></div>`;
  const bar = (l, v, cv) => `<div class="bar"><span>${l}</span><span class="m"><i style="width:${v || 0}%"></i></span><span class="n">${v == null ? '—' : v.toFixed(0) + '%'}</span></div>`;
  const vf = $('#vFrame'); vf.style.aspectRatio = 'auto'; vf.style.background = 'transparent';
  vf.innerHTML = `<div class="stats">
    <div class="big">${tile('Population', st.population, v => v.toLocaleString())}${tile('Median income', st.median_income, v => '$' + v.toLocaleString())}${tile('Median home value', st.median_home_value, v => '$' + v.toLocaleString())}${tile('Median age', st.median_age, v => v.toFixed(1))}</div>
    <div class="bars">${bar('Renters', st.pct_renters)}${bar('Below poverty', st.pct_poverty)}${bar("Bachelor's+", st.pct_bachelors)}${bar('Hispanic/Latino', st.pct_hispanic)}${bar('White (NH)', st.pct_white)}${bar('Black (NH)', st.pct_black)}${bar('Asian (NH)', st.pct_asian)}</div>
    <div class="note">${county ? `Broward overall: pop ${county.population.toLocaleString()}, median income $${county.median_income.toLocaleString()}, median age ${county.median_age}.` : ''} ${demo && demo.bls ? `County unemployment ${demo.bls.unemployment_rate}% (${esc(demo.bls.period)}, BLS).` : ''} ${name === 'Unincorporated Broward' ? 'Unincorporated areas have no Census place figures; neighborhood-level shading still works.' : ''}</div>
  </div>`;
  $('#vFoot').innerHTML = `<span>${n} camera${n === 1 ? '' : 's'} here</span><span class="spacer"></span>${n ? `<a href="#" id="vCams">Show only these cameras</a>` : ''}`;
  if (n) $('#vCams').onclick = e => { e.preventDefault(); $('#cityFilter').value = name; $('#cityFilter').dispatchEvent(new Event('change')); };
  const b = cityLayer.getLayers().find(l => l.feature.properties.name === name); if (b) map.fitBounds(b.getBounds().pad(0.1));
}
$('#cityLines').onchange = () => { $('#cityLines').checked ? cityLayer.addTo(map) : map.removeLayer(cityLayer); renderLabels(); };
$('#cityLabels').onchange = renderLabels;
$('#metric').onchange = () => { metric = $('#metric').value; if (metric && bizMode){ $('#bizMode').value = ''; bizMode = ''; applyBiz(); } if (level === 'tract' && metric && !tractGeo) loadTracts().then(applyDemo); else applyDemo(); };
document.querySelectorAll('input[name=level]').forEach(r => r.onchange = () => { level = r.value; if (level === 'tract' && !tractGeo) loadTracts().then(applyDemo); else applyDemo(); });
function loadTracts(){ return fetch('data/tracts.geojson').then(r => r.json()).then(g => { tractGeo = g; tractLayer.addData(g); }).catch(() => {}); }
fetch('data/cities.geojson').then(r => r.json()).then(g => { cityGeo = g; cityLayer.addData(g); $('#cityCount').textContent = g.features.filter(f => f.properties.name !== 'Unincorporated Broward').length; renderLabels(); applyDemo(); }).catch(() => {});
fetch('data/demographics.json', {cache:'no-cache'}).then(r => r.json()).then(d => { demo = d; applyDemo(); }).catch(() => {});

// ---- crime
let crime = null, crimeLoaded = false, crimeCats = new Set(), crimeMode = 'pins';
const crimeCluster = L.markerClusterGroup({maxClusterRadius: 30, disableClusteringAtZoom: 15, showCoverageOnHover: false,
  iconCreateFunction: c => L.divIcon({html: `<div><span>${c.getChildCount()}</span></div>`, className: 'marker-cluster crime-cluster', iconSize: L.point(36, 36)})});
let heat = null;
function crimeFiltered(){
  if (!crime) return [];
  const from = $('#crimeFrom').value, to = $('#crimeTo').value ? $('#crimeTo').value + 'T23:59' : '';
  return crime.incidents.filter(i => (!from || i.date >= from) && (!to || i.date <= to) && (!crimeCats.size || crimeCats.has(i.category)) && (!cityFilter || i.city === cityFilter));
}
function renderCrime(){
  crimeCluster.clearLayers(); if (heat){ map.removeLayer(heat); heat = null; }
  if (!$('#crimeOn').checked || !crime){ $('#crimeCount').textContent = ''; if (map.hasLayer(crimeCluster)) map.removeLayer(crimeCluster); return; }
  const rows = crimeFiltered();
  $('#crimeCount').textContent = rows.length.toLocaleString();
  if (crimeMode !== 'heat'){
    if (!map.hasLayer(crimeCluster)) map.addLayer(crimeCluster);
    const icon = L.divIcon({className:'', html:'<div class="crime-pin"></div>', iconSize:[10,10], iconAnchor:[5,5], popupAnchor:[0,-6]});
    const ms = rows.slice(0, 20000).map(i => L.marker([i.lat, i.lon], {icon}).bindPopup(`<b>${esc(i.category)}</b>${esc(i.type)}<br><span class="muted">${esc((i.date||'').replace('T',' '))}${i.address ? ' · ' + esc(i.address) : ''}</span><br><span class="muted">${esc(i.agency)}</span>${i.url ? ` · <a href="${esc(i.url)}" target="_blank" rel="noopener">source ↗</a>` : ''}`));
    crimeCluster.addLayers(ms);
  } else if (map.hasLayer(crimeCluster)) map.removeLayer(crimeCluster);
  if (crimeMode !== 'pins' && window.L.heatLayer){
    heat = L.heatLayer(rows.map(i => [i.lat, i.lon, 1]), {radius: 18, blur: 15, maxZoom: 16, minOpacity: 0.2, max: Math.max(3, rows.length / 150),
      gradient: {0.2:'#fde0d9', 0.5:'#f4a08a', 0.75:'#dc4a30', 1:'#8a1a0e'}}).addTo(map);
  }
}
function loadCrime(){
  if (crimeLoaded) return Promise.resolve();
  $('#crimeAgencies').innerHTML = '<span class="spin"></span> loading incidents…';
  return fetch('data/crime.json', {cache:'no-cache'}).then(r => r.json()).then(d => {
    crime = d; crimeLoaded = true;
    const cats = {}; d.incidents.forEach(i => cats[i.category] = (cats[i.category]||0) + 1);
    $('#crimeCats').innerHTML = Object.entries(cats).sort((a,b) => b[1]-a[1]).map(([c, n]) => `<span class="chip" data-cat="${esc(c)}" title="${n.toLocaleString()} incidents">${esc(c)}</span>`).join('');
    document.querySelectorAll('.chip[data-cat]').forEach(ch => ch.onclick = () => { const c = ch.dataset.cat; crimeCats.has(c) ? crimeCats.delete(c) : crimeCats.add(c); ch.classList.toggle('on', crimeCats.has(c)); renderCrime(); });
    const dates = d.incidents.map(i => i.date).filter(Boolean).sort();
    if (dates.length){ const last = dates[dates.length-1].slice(0,10); const start = new Date(last); start.setDate(start.getDate() - 90); $('#crimeTo').value = last; $('#crimeFrom').value = start.toISOString().slice(0,10); $('#crimeFrom').min = dates[0].slice(0,10); $('#crimeTo').max = last; }
    $('#crimeAgencies').innerHTML = (d.agencies || []).map(a => `<div><b>${esc(a.name)}</b>: ${(a.count||0).toLocaleString()} incidents${a.historical ? `, <span class="bad" style="background:none">historical, through ${esc((a.newest||'').slice(0,7))}</span>` : ''} · <a href="${esc(a.source)}" target="_blank" rel="noopener">source</a></div>`).join('') + '<div>Other agencies publish no incident feed yet; see the README for the per-city picture.</div>';
  }).catch(e => { $('#crimeAgencies').textContent = 'Could not load crime data: ' + e.message; });
}
$('#crimeOn').onchange = () => { if ($('#crimeOn').checked) loadCrime().then(renderCrime); else renderCrime(); };
$('#crimeFrom').onchange = $('#crimeTo').onchange = renderCrime;
document.querySelectorAll('input[name=cmode]').forEach(r => r.onchange = () => { crimeMode = r.value; renderCrime(); });

// ---- businesses
let biz = null, bizPts = null, zctaGeo = null, bizMode = '', bizType = '';
const BIZ_RAMP = ['#ede9fe','#c4b5fd','#a78bfa','#7c3aed','#4c1d95'];
let zipLayer = L.geoJSON(null, {style: zipStyle, onEachFeature: (f, l) => { l.on('mouseover', e => { l.setStyle({weight:2}); showBizTip(e, 'ZIP ' + f.properties.zip, bizValue(f)); }); l.on('mouseout', () => { zipLayer.resetStyle(l); map.closeTooltip(); }); }});
let bizPointLayer = L.layerGroup();
let bizBreaks = [];
function bizValue(f){
  if (!biz) return null;
  if (bizMode === 'city'){ const t = biz.osm.by_city[f.properties.name]; return t ? (bizType ? (t.groups[bizType]||0) : t.total) : null; }
  if (bizMode === 'zip'){ const t = biz.osm.by_zip[f.properties.zip]; return t ? (bizType ? (t.groups[bizType]||0) : t.total) : null; }
  if (bizMode === 'zbp'){ const z = biz.census && biz.census.zbp ? biz.census.zbp.zips[f.properties.zip] : null; return z ? (z[bizType || '00'] ?? null) : null; }
  return null;
}
function bizColor(v){ if (v == null || !bizBreaks.length) return null; let i = 0; while (i < bizBreaks.length - 1 && v > bizBreaks[i]) i++; return BIZ_RAMP[Math.min(i, 4)]; }
function zipStyle(f){ const c = bizColor(bizValue(f)); return {color:'#6d28d9', weight:0.8, opacity:0.7, fillColor: c || '#000', fillOpacity: c ? 0.55 : 0}; }
function showBizTip(e, title, v){ L.tooltip({sticky:true}).setLatLng(e.latlng).setContent(`<b>${esc(title)}</b><br>${v == null ? 'no data' : v.toLocaleString() + ' ' + (bizMode === 'zbp' ? 'establishments' : 'mapped businesses')}${bizType ? ' · ' + esc(bizTypeLabel()) : ''}`).addTo(map); }
function bizTypeLabel(){ return bizMode === 'zbp' ? (biz.sector_labels[bizType] || bizType) : bizType; }
function fillBizTypes(){
  const sel = $('#bizType'); const cur = sel.value;
  if (bizMode === 'zbp'){ const secs = biz.census && biz.census.cbp ? biz.census.cbp.sectors : {}; sel.innerHTML = '<option value="">All sectors</option>' + Object.entries(secs).filter(([c]) => c !== '00').sort((a,b) => b[1].estab - a[1].estab).map(([c, s]) => `<option value="${c}">${esc(s.label)} (${s.estab.toLocaleString()} in Broward)</option>`).join(''); }
  else { sel.innerHTML = '<option value="">All types</option>' + Object.entries(biz.osm.groups).map(([g, n]) => `<option value="${esc(g)}">${esc(g)} (${n.toLocaleString()})</option>`).join(''); }
  sel.value = [...sel.options].some(o => o.value === cur) ? cur : ''; bizType = sel.value;
}
function applyBiz(){
  const lg = $('#legend');
  if (!bizMode || !biz){ if (map.hasLayer(zipLayer)) map.removeLayer(zipLayer); if (map.hasLayer(bizPointLayer)) map.removeLayer(bizPointLayer); if (!metric) lg.classList.remove('open'); if (metric) applyDemo(); $('#bizNote').textContent = ''; return; }
  if (metric){ $('#metric').value = ''; metric = ''; applyDemo(); }   // one choropleth at a time
  const feats = bizMode === 'city' ? (cityGeo ? cityGeo.features : []) : (zctaGeo ? zctaGeo.features : []);
  bizBreaks = quantiles(feats.map(bizValue));
  if (bizMode === 'city'){ if (map.hasLayer(zipLayer)) map.removeLayer(zipLayer); cityLayer.setStyle(f => { const c = bizColor(bizValue(f)); return Object.assign(cityStyle(f), {fillColor: c || '#000', fillOpacity: c ? 0.55 : 0.02}); }); }
  else { cityLayer.setStyle(cityStyle); if (!map.hasLayer(zipLayer)) zipLayer.addTo(map); zipLayer.setStyle(zipStyle); cityLayer.bringToFront(); }
  const unit = bizMode === 'zbp' ? 'establishments' : 'mapped businesses';
  const src = bizMode === 'zbp' ? `Census ZIP Code Business Patterns ${biz.census && biz.census.zbp ? biz.census.zbp.year : ''}` : 'OpenStreetMap (community-mapped, not a complete register)';
  if (bizBreaks.length){ let lo = null; lg.innerHTML = `<b>${esc(bizType ? bizTypeLabel() : 'All businesses')}</b>` + bizBreaks.map((b, i) => { const r = `<div class="row"><span class="box" style="background:${BIZ_RAMP[i]}"></span>${lo == null ? 'up to ' : lo.toLocaleString() + ' to '}${b.toLocaleString()}</div>`; lo = b; return r; }).join('') + `<div class="src">${unit}, by ${bizMode === 'city' ? 'city' : 'ZIP'} · ${src}</div>`; lg.classList.add('open'); }
  else { lg.innerHTML = `<b>No data</b><div class="src">${bizMode === 'zbp' ? 'Census figures need the API key (see README).' : 'No business counts available.'}</div>`; lg.classList.add('open'); }
  $('#bizNote').textContent = bizMode === 'zbp' ? 'Official counts of employer establishments by industry sector. Roughly two years behind.' : `${biz.osm.count.toLocaleString()} businesses mapped in OpenStreetMap across Broward. Hover a shape for its count; zoom in for individual businesses.`;
  renderBizPoints();
}
function renderBizPoints(){
  bizPointLayer.clearLayers();
  if (!bizMode || !bizPts || !$('#bizPoints').checked || map.getZoom() < 15){ if (map.hasLayer(bizPointLayer)) map.removeLayer(bizPointLayer); return; }
  const b = map.getBounds().pad(0.2); const icon = L.divIcon({className:'', html:'<div class="biz-pin"></div>', iconSize:[8,8], iconAnchor:[4,4], popupAnchor:[0,-5]});
  let n = 0;
  for (const p of bizPts){
    const [lat, lon, group, kind, name, city, zip] = p;
    if (bizMode !== 'zbp' && bizType && group !== bizType) continue;
    if (!b.contains([lat, lon])) continue;
    if (++n > 3000) break;
    bizPointLayer.addLayer(L.marker([lat, lon], {icon, title: name || kind}).bindPopup(`<b>${esc(name || kind)}</b>${esc(group)}${kind ? ' · ' + esc(kind.replace(/_/g,' ')) : ''}<br><span class="muted">${esc(city)}${zip ? ' ' + esc(zip) : ''}</span>`));
  }
  if (!map.hasLayer(bizPointLayer)) bizPointLayer.addTo(map);
}
map.on('moveend', renderBizPoints);
function loadBiz(){
  const jobs = [];
  if (!biz) jobs.push(fetch('data/business.json', {cache:'no-cache'}).then(r => r.json()).then(d => { biz = d; }));
  if (!zctaGeo) jobs.push(fetch('data/zctas.geojson').then(r => r.json()).then(g => { zctaGeo = g; zipLayer.addData(g); }).catch(() => {}));
  if (!bizPts) jobs.push(fetch('data/business_points.json').then(r => r.json()).then(d => { bizPts = d.points; }).catch(() => {}));
  return Promise.all(jobs);
}
$('#bizMode').onchange = () => { bizMode = $('#bizMode').value; if (!bizMode){ applyBiz(); return; } $('#bizNote').innerHTML = '<span class="spin"></span> loading…'; loadBiz().then(() => { fillBizTypes(); applyBiz(); }).catch(e => { $('#bizNote').textContent = 'Could not load business data: ' + e.message; }); };
$('#bizType').onchange = () => { bizType = $('#bizType').value; applyBiz(); };
$('#bizPoints').onchange = renderBizPoints;

// ---- load
fetch('data/cams.json', {cache:'no-cache'}).then(r => r.json()).then(d => {
  cams = (d.cams || []).filter(c => typeof c.lat === 'number' && typeof c.lon === 'number');
  cams.forEach((c, i) => { c.id = c.id || ('cam' + i); c.type = c.type || 'other'; c.kind = c.kind || 'link'; });
  buildFilters(); rebuild();
  const when = d.generated ? new Date(d.generated) : null;
  $('#dataNote').innerHTML = `${cams.length} cameras${when ? ', list updated ' + when.toLocaleDateString() : ''}. Traffic cameras are FDOT snapshots that refresh every few seconds; others stream from their owners. Know a cam that is missing? <a href="https://github.com/fenphen/trooper-cadence/issues/new?title=Broward%20cam%20suggestion" target="_blank" rel="noopener">Suggest it</a>.`;
  const m = location.hash.match(/cam=([^&]+)/);
  if (m){ const c = cams.find(x => x.id === decodeURIComponent(m[1])); if (c){ map.setView([c.lat, c.lon], 15); openViewer(c); } }
}).catch(e => { $('#status').textContent = 'Could not load the camera list'; $('#dataNote').textContent = 'Could not load data/cams.json: ' + e.message; });
</script>
